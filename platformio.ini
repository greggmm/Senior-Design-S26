; Root PlatformIO wrapper for the Arduino Uno rover project.
; The ESP32 projects still use controller/platformio.ini and esp32cam/platformio.ini.

[platformio]
src_dir = arduino/src
include_dir = arduino/include
lib_dir = arduino/lib
test_dir = arduino/test
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino

upload_port = COM6
upload_speed = 115200

monitor_port = COM6
monitor_speed = 115200

monitor_dtr = 0
monitor_rts = 0

lib_deps = arduino-libraries/Servo@^1.3.0
